<!-- App shell. Screens live here; each script module owns one job. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101418" />
    <title>Tilt Maze</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <main>
      <section data-screen="menu">
        <h1>Tilt Maze</h1>
        <p>Pick a size. Each play builds a new maze. Roll the ball to the green exit with the arrow keys or WASD.</p>
        <p class="best" hidden></p>
        <div class="actions">
          <button type="button" data-go="game" data-level="easy">Easy</button>
          <button type="button" data-go="game" data-level="hard">Hard</button>
          <button type="button" data-go="game" data-level="very-hard">Very hard</button>
          <button type="button" data-go="scores">Scores</button>
        </div>
      </section>

      <section data-screen="game" hidden>
        <p class="timer">Time <span>0:00.0</span></p>
        <p class="tilt-note" hidden>Tilt is not available. Use the keys or the buttons.</p>
        <canvas class="board" aria-label="Maze"></canvas>
        <div class="pad">
          <button type="button" data-hold="up">Up</button>
          <button type="button" data-hold="left">Left</button>
          <button type="button" data-hold="down">Down</button>
          <button type="button" data-hold="right">Right</button>
        </div>
        <div class="actions">
          <button type="button" data-action="hint" hidden>Hint</button>
          <button type="button" data-go="menu">Menu</button>
        </div>
      </section>

      <section data-screen="scores" hidden>
        <h1>Scores</h1>
        <p class="score-empty">No saved times yet.</p>
        <ol class="score-list"></ol>
        <div class="actions">
          <button type="button" data-go="game">Play again</button>
          <button type="button" data-action="clear">Clear</button>
          <button type="button" data-go="menu">Menu</button>
        </div>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
